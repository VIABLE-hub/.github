name: Feature proposal
description: Propose a bounded capability or improvement.
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem and desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and alternatives
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Protocol, security and compatibility considerations
